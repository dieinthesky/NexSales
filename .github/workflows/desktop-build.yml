# Gera o instalador Windows (CaixaDoBairro-Instalador.exe) e publica no Releases.
# Rode manualmente: Actions → Build desktop Windows → Run workflow

name: Build desktop Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # LTS com prebuilds estáveis; evita compile no npm ci
          node-version: '20.18.1'
          cache: 'npm'

      # Compilador C++ para better-sqlite3 / electron-rebuild
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        # ignore-scripts: não compila native addons no install (VS 18 no runner
        # quebra o node-gyp). O rebuild do Electron vem no passo seguinte.
        run: npm ci --ignore-scripts

      - name: Check required secrets
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "Faltam secrets: NEXT_PUBLIC_SUPABASE_URL e NEXT_PUBLIC_SUPABASE_ANON_KEY"
            echo "Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Next.js build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          OFFLINE_SESSION_SECRET: ${{ secrets.OFFLINE_SESSION_SECRET || 'desktop-build-placeholder-secret-32chars' }}
        run: npm run build

      - name: Rebuild better-sqlite3 for Electron
        env:
          GYP_MSVS_VERSION: '2022'
          npm_config_msvs_version: '2022'
        run: npx --yes @electron/rebuild@4.0.1 -f -w better-sqlite3

      - name: Copy standalone assets
        run: node scripts/copy-standalone.mjs

      - name: Package Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaixaDoBairro-Instalador
          path: instalador/CaixaDoBairro-Instalador.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-v0.1.{0}', github.run_number) }}
          name: CaixaDoBairro Desktop ${{ github.ref_type == 'tag' && github.ref_name || format('v0.1.{0}', github.run_number) }}
          files: instalador/CaixaDoBairro-Instalador.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
