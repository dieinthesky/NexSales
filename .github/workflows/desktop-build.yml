# Gera o instalador Windows + metadados de auto-update (latest.yml).
# Rode: Actions → Build desktop Windows → Run workflow

name: Build desktop Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: 'npm'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        # --ignore-scripts: evita rebuild nativo no install; better-sqlite3
        # é recompilado depois para o ABI do Electron. O binário do Electron
        # precisa ser baixado à parte (postinstall é pulado).
        run: npm install --ignore-scripts

      - name: Download Electron binary
        run: node node_modules/electron/install.js

      - name: Bump app version for this build
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == desktop-v* ]]; then
            VERSION="${GITHUB_REF_NAME#desktop-v}"
          else
            VERSION="0.1.${GITHUB_RUN_NUMBER}"
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building CaixaDoBairro v$VERSION"

      - name: Check required secrets
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "Faltam secrets: NEXT_PUBLIC_SUPABASE_URL e NEXT_PUBLIC_SUPABASE_ANON_KEY"
            exit 1
          fi

      - name: Next.js build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          OFFLINE_SESSION_SECRET: ${{ secrets.OFFLINE_SESSION_SECRET || 'desktop-build-placeholder-secret-32chars' }}
        # --webpack: standalone inclui melhor os serverExternalPackages (better-sqlite3)
        run: npx next build --webpack

      - name: Rebuild better-sqlite3 for Electron
        env:
          GYP_MSVS_VERSION: '2022'
          npm_config_msvs_version: '2022'
        run: npx --yes @electron/rebuild@4.0.1 -f -w better-sqlite3

      - name: Copy standalone assets
        run: node scripts/copy-standalone.mjs

      - name: Smoke-check better-sqlite3 in standalone (Electron ABI)
        shell: bash
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: |
          NODE_FILE=".next/standalone/node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          if [ ! -f "$NODE_FILE" ]; then
            echo "Missing $NODE_FILE"
            exit 1
          fi
          # Carrega com o binário do Electron (mesmo ABI do rebuild), não com o Node do runner.
          node node_modules/electron/cli.js -e "require('./.next/standalone/node_modules/better-sqlite3'); console.log('better-sqlite3 ok')"

      - name: Package Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaixaDoBairro-Instalador
          path: |
            instalador/CaixaDoBairro-Instalador.exe
            instalador/latest.yml
            instalador/*.blockmap
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ env.APP_VERSION }}
          name: CaixaDoBairro Desktop v${{ env.APP_VERSION }}
          files: |
            instalador/CaixaDoBairro-Instalador.exe
            instalador/latest.yml
            instalador/*.blockmap
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
